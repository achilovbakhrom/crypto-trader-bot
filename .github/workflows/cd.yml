name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-prod
  cancel-in-progress: false   # never cancel a running deploy

env:
  REGISTRY:   ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/crypto-trader-bot

jobs:
  # ── Build & push Docker image ────────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Hetzner ────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Hetzner (prod)
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e

            cd ${{ secrets.DEPLOY_DIR }}

            # Pull the latest image
            docker compose -f docker-compose.prod.yml pull bot

            # Restart only the bot (zero-downtime for infra)
            docker compose -f docker-compose.prod.yml up -d --no-deps bot

            # Run any pending migrations
            docker compose -f docker-compose.prod.yml exec -T bot \
              /app/bot migrate 2>/dev/null || \
            docker run --rm \
              --env-file .env \
              --network trader_trader_net \
              ghcr.io/${{ env.IMAGE_NAME }}:latest \
              sqlx migrate run --source /app/migrations || true

            # Clean up old images
            docker system prune -f

            echo "Deploy complete — $(date -u)"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key:      ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_DIR }}
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=20 bot
